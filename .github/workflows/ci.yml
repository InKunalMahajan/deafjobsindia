name: CI

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    name: Audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit newsroom content
        run: npm run content:audit

      - name: Build Astro site
        run: npm run build
        env:
          SITE_URL: https://deafjobsindia.in

      - name: Verify production output
        run: npm run verify:dist
