name: Laravel CI

on:
  pull_request:
  push:
    branches:
      - main
      - migration/laravel-13

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Validate Composer metadata
        run: composer validate --no-check-publish

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend packages
        run: npm install --no-audit --no-fund

      - name: Configure testing environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Compile Tailwind and Vite
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

      - name: Check migration source count
        run: php artisan news:import --dry-run
